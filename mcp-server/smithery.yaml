startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ARC_NETWORK:
        type: string
        title: Network
        description: >-
          Which chain this server serves. "base-mainnet" is BaseBounty, the
          same board live on Base since 2026-08-14, where gas is ETH rather
          than USDC. "arc-mainnet" additionally requires the agent-sdk's
          ARC_MAINNET_* variables (chain id, RPC, explorer, contract
          addresses), which Circle has not published yet.
        enum:
          - arc-testnet
          - base-mainnet
          - base-sepolia
          - arc-mainnet
        default: "arc-testnet"
      BOUNTY_ADAPTER_ADDRESS:
        type: string
        title: Bounty adapter address (optional override)
        description: >-
          Leave blank. Every network ships its canonical adapter inside the
          server, so an unconfigured install is a working one. Set this only to
          point a testnet at a different deployment; it is ignored on mainnet
          chains so a stale testnet address can never be used against real
          funds. Addresses: contracts/DEPLOYMENTS.md in the repo.
      ARC_RPC_URL:
        type: string
        title: RPC URL
        description: >-
          Optional. Overrides the RPC endpoint of whichever network is selected
          above. Defaults to that network's public endpoint.
      AGENT_PRIVATE_KEY:
        type: string
        title: Agent private key
        description: >-
          Raw EOA private key for worker mode (take/submit/register/auto_approve
          tools). Leave unset, together with the Circle wallet fields below,
          to run in read-only mode with zero credentials.
      CIRCLE_API_KEY:
        type: string
        title: Circle API key
        description: >-
          Circle Developer-Controlled Wallet credential. Use together with
          ENTITY_SECRET, CIRCLE_WALLET_ID and CIRCLE_WALLET_ADDRESS instead of
          AGENT_PRIVATE_KEY to sign without holding a raw private key.
      ENTITY_SECRET:
        type: string
        title: Circle entity secret
      CIRCLE_WALLET_ID:
        type: string
        title: Circle wallet ID
      CIRCLE_WALLET_ADDRESS:
        type: string
        title: Circle wallet address
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        ARC_NETWORK: config.ARC_NETWORK || 'arc-testnet',
        // Deliberately no default: the server resolves each network's canonical
        // adapter itself, and a hardcoded Arc address here would follow the
        // user onto Base Sepolia.
        BOUNTY_ADAPTER_ADDRESS: config.BOUNTY_ADAPTER_ADDRESS || '',
        ARC_RPC_URL: config.ARC_RPC_URL || '',
        AGENT_PRIVATE_KEY: config.AGENT_PRIVATE_KEY || '',
        CIRCLE_API_KEY: config.CIRCLE_API_KEY || '',
        ENTITY_SECRET: config.ENTITY_SECRET || '',
        CIRCLE_WALLET_ID: config.CIRCLE_WALLET_ID || '',
        CIRCLE_WALLET_ADDRESS: config.CIRCLE_WALLET_ADDRESS || ''
      }
    })
