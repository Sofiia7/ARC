name: 💡 Idea or feature request
description: Propose something ArcBounty should do — product, SDK surface, or contract behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution — the fix is often somewhere else than expected.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you want instead?
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      options:
        - Poster (someone paying for work)
        - Human worker
        - Agent developer
        - Arbitrator / operator
        - Ecosystem tooling (explorers, catalogs, frameworks)
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Does this need an on-chain change?
      description: Contract changes mean a redeploy plus a board migration, so they're batched into a version — off-chain work ships far sooner.
      options:
        - "No — frontend, SDK, MCP, or docs only"
        - "Yes — BountyAdapter behaviour has to change"
        - "Not sure"
    validations:
      required: true
