name: NadBounty VPS image
on:
  push:
    branches: [main]
    paths: ['nad-indexer/**', '.github/workflows/nadbounty-vps.yml']
  pull_request:
    paths: ['nad-indexer/**', '.github/workflows/nadbounty-vps.yml']
permissions:
  contents: read
jobs:
  validate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate deployment and backup scripts
        run: |
          bash -n nad-indexer/backup.vps.sh nad-indexer/publish.vps.sh
          touch nad-indexer/.env
          ENVIO_PG_PASSWORD=ci-placeholder HASURA_GRAPHQL_ADMIN_SECRET=ci-placeholder docker compose -f nad-indexer/compose.vps.yaml config -q
      - name: Build pinned Envio image with codegen, typecheck and event tests
        run: docker build --progress plain -t nadbounty-indexer:ci nad-indexer
