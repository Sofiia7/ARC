name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-07, M-11)
        with: { node-version: "20" }
      - name: Address & docs consistency
        run: npx -y tsx scripts/check-consistency.ts

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2 (resolved 2026-09-07, M-11)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1 (resolved 2026-09-07, M-11)
        # Pinned, not `stable`. `stable` is a moving target, and a Foundry
        # release that changes gas accounting turns every entry in
        # .gas-snapshot into a diff, failing CI on whatever commit happens to
        # land next even when it only touched docs. That is exactly what broke
        # the run on 31d0ac6. Bump this deliberately, and refresh the snapshot
        # in the same commit.
        with: { version: v1.7.1 }
      - name: forge fmt
        run: forge fmt --check
      - name: forge build
        run: forge build --sizes
      - name: forge test (unit + invariants, skip fork)
        run: forge test -vvv --no-match-contract BountyAdapterForkTest
      - name: gas snapshot - no regressions
        run: |
          if [ -f .gas-snapshot ]; then
            forge snapshot --check --no-match-contract BountyAdapterForkTest
          else
            echo "::warning::no .gas-snapshot yet - run forge snapshot locally and commit it"
          fi
      - name: slither (config-gated, triaged in SLITHER.md)
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0 (resolved 2026-09-07, M-11)
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: low
          solc-version: 0.8.30

  contracts-fork:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1 (resolved 2026-09-07, M-11)
        # Pinned, not `stable`. `stable` is a moving target, and a Foundry
        # release that changes gas accounting turns every entry in
        # .gas-snapshot into a diff, failing CI on whatever commit happens to
        # land next even when it only touched docs. That is exactly what broke
        # the run on 31d0ac6. Bump this deliberately, and refresh the snapshot
        # in the same commit.
        with: { version: v1.7.1 }
      - name: fork test against Arc Testnet
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
        run: |
          if [ -z "$ARC_TESTNET_RPC_URL" ]; then
            echo "::warning::no ARC_TESTNET_RPC_URL secret, skipping"
            exit 0
          fi
          forge test --fork-url "$ARC_TESTNET_RPC_URL" --match-contract BountyAdapterForkTest -vvv

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-07, M-11)
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      # npm install (not ci): the lockfile is generated on Windows, and porto's
      # platform-specific optional deps make `npm ci`'s strict tree match fail
      # on the Linux runner. install still honours the lock for resolved deps.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: build
        env:
          NEXT_PUBLIC_ARC_NETWORK: "arc-testnet"
          NEXT_PUBLIC_BOUNTY_ADAPTER_ADDRESS: "0xeDf2c738915b042da97788b2b5499D4655FB1f20" # V4.7, 2026-09-07
          NEXT_PUBLIC_RPC_URL: "https://rpc.testnet.arc.network"
        run: npm run build
      # Informational only (continue-on-error): reviewed-and-accepted findings
      # (currently qs/express/body-parser, see GRANT_APPLICATION.md "Known
      # risks") must not block CI. It exists so *new* advisories in other deps
      # surface in the log instead of relying on someone running `npm audit`
      # by hand. (V4.7, M-11: this comment used to say "next@14... pending the
      # next@16 migration" - the repo has been on next@15.5.24 for a while;
      # that framing was stale, not a live migration plan.)
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-sdk } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-07, M-11)
        with: { node-version: "20" }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-07, M-11)
        with: { node-version: "20" }
      # V4.7 (M-11): mcp-server depends on the PUBLISHED arcbounty-agent-sdk
      # (a semver range against the npm registry, not a local file: link) -
      # this used to build agent-sdk locally first on the theory that
      # in-repo SDK changes would be exercised here before an npm release,
      # but nothing ever wired that local build into mcp-server's install;
      # `npm install` below always pulled from the registry regardless. This
      # job now verifies what mcp-server actually ships with; a source-level
      # SDK change needs its own publish (see the `sdk` job above for
      # in-repo verification instead).
      - name: install mcp-server
        working-directory: mcp-server
        run: npm install
      - name: typecheck
        working-directory: mcp-server
        run: npm run typecheck
      - name: build
        working-directory: mcp-server
        run: npm run build
      - name: npm audit (report only)
        working-directory: mcp-server
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  facade-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: facade-api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-07, M-11)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-07, M-11)
        with: { node-version: "20" }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
